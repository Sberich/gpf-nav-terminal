name: Update GPF NAV Data

on:
  schedule:
    # 09:45 ICT (Bangkok UTC+7) is 02:45 UTC, Mon-Fri (earliest GPF morning publish window)
    - cron: '45 2 * * 1-5'
    # 10:15 ICT (Bangkok UTC+7) is 03:15 UTC, Mon-Fri (morning primary run)
    - cron: '15 3 * * 1-5'
    # 11:00 ICT (Bangkok UTC+7) is 04:00 UTC, Mon-Fri (midday backup run)
    - cron: '0 4 * * 1-5'
    # 12:30 ICT (Bangkok UTC+7) is 05:30 UTC, Mon-Fri (lunchtime sweep run)
    - cron: '30 5 * * 1-5'
    # 17:00 ICT (Bangkok UTC+7) is 10:00 UTC, Mon-Fri (end-of-day final run)
    - cron: '0 10 * * 1-5'
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force recalculation and export even if no new dates'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update-nav:
    name: Ingest NAV, Export & Verify Parity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run NAV Ingestion and Export Pipeline
        run: |
          if [ "${{ inputs.force_update }}" = "true" ]; then
            python scripts/update_nav.py --force
          else
            python scripts/update_nav.py
          fi

      - name: Verify Data Parity
        run: |
          python scripts/verify_parity.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Sync updated data and exports to root folders as well for Cloudflare Pages static root hosting
          mkdir -p data export
          cp -rf public/data/* data/ 2>/dev/null || true
          cp -rf public/export/* export/ 2>/dev/null || true

          if [ -n "$(git status --porcelain public/data public/export data export)" ]; then
            echo "Changes detected in data or export. Staging and committing..."
            git add public/data/ public/export/ data/ export/
            git commit -m "chore(data): auto-update GPF NAV data [skip ci]"
            git push
            echo "Successfully committed and pushed updated NAV data."
          else
            echo "No changes detected. Dataset is already up to date."
          fi
