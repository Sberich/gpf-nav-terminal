name: Update GPF NAV Data

on:
  schedule:
    # รันอัตโนมัติทุกวันจันทร์ - ศุกร์ เวลา 17:00 น. ตามเวลาไทย (10:00 UTC)
    - cron: '0 10 * * 1-5'
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force recalculation and export even if no new dates'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update-nav:
    name: Ingest NAV, Export & Verify Parity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run NAV Ingestion and Export Pipeline
        run: |
          if [ "${{ inputs.force_update }}" = "true" ]; then
            python scripts/update_nav.py --force
          else
            python scripts/update_nav.py
          fi

      - name: Verify Data Parity
        run: |
          python scripts/verify_parity.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain public/data public/export)" ]; then
            echo "Changes detected in public/data or public/export. Staging and committing..."
            git add public/data/ public/export/
            git commit -m "chore(data): auto-update GPF NAV data [skip ci]"
            git push
            echo "Successfully committed and pushed updated NAV data."
          else
            echo "No changes detected in public/data or public/export. Dataset is already up to date."
          fi
